# ==========================================
# 🚀 Auto Blog System Configuration (absianp.github.io)
# ==========================================

# 1. AI 생성 엔진 설정 (Google Antigravity CLI / SDK / On-Device 지원)
engine:
  provider: "antigravity_cli" # antigravity_cli | antigravity_sdk | local_ollama | gemini_api
  cli_command: "agy"           # Antigravity CLI 명령어 (agy 또는 antigravity)
  local_model: "gemma2:2b"     # 라즈베리파이 5 온디바이스 모델 (Ollama / LiteRT)
  ollama_url: "http://localhost:11434/v1"

# 2. 블로그 사이트 메타데이터 (도메인 루트)
site:
  title: "골든라이프(GoldenLife)"
  description: "기초연금 및 65세 이상 복지 혜택, 국민·주택연금 절세 상식, 시니어 관절·혈관 건강 정보를 알기 쉽게 전하는 실버 전문 매거진"
  author: "골든라이프 편집팀"
  url: "https://goldianpark.github.io"
  default_language: "ko"
  theme_color: "#2563eb"

# 3. 구글 애드센스 (Google AdSense) 설정
adsense:
  enabled: false
  publisher_id: ""
  auto_ads: true
  slots:
    top_banner: ""
    in_article_1: ""
    in_article_2: ""
    bottom_banner: ""
    sidebar_banner: ""

# 3-1. 웹 분석 (GA4) 및 검색엔진 소유권 인증
analytics:
  ga_id: "" # 구글 애널리틱스 4 측정 ID (예: G-XXXXXXXXXX)
  naver_verification: "" # 네이버 서치어드바이저 사이트 확인 메타태그 값


# 4. 콘텐츠 생성 & 타겟 분야 설정
content:
  categories:
    - name: "정부지원금 & 복지"
      slug: "정부지원금-and-복지"
      keywords: ["65세이상혜택", "기초연금", "노인복지", "통신비감면", "틀니임플란트지원"]
    - name: "연금 & 절세 상식"
      slug: "연금-and-절세-상식"
      keywords: ["국민연금조기수령", "주택연금", "상속세면제한도", "피부양자자격유지", "사전증여"]
    - name: "시니어 건강 & 일상"
      slug: "시니어-건강-and-일상"
      keywords: ["퇴행성관절염", "무릎통증완화운동", "인공관절수술비지원", "치매자가진단", "시니어영양제"]
  
  target_length_words: 1800
  tone_style: "6070 어르신들이 읽기 편안하도록 친절하고 정중하며 명확한 해결책을 제시하는 설명조 스타일"
  include_faq: true
  include_toc: true

# 5. AI 에이전트 모델 설정
agent:
  model_name: "gemini-2.5-flash"
  temperature: 0.7
  max_output_tokens: 4096

# 6. 사용자 승인 & 모바일 스마트 브리핑 (Telegram Bot)
telegram:
  enabled: true
  bot_token: "" # .env 파일의 TELEGRAM_BOT_TOKEN 에서 자동 로드
  chat_id: ""   # .env 파일의 TELEGRAM_CHAT_ID 에서 자동 로드

# 7. GitHub 및 배포 경로 설정
github:
  repo_root: "../"
  blog_content_dir: "../blog-frontend/src/content/blog"
  auto_git_commit: true
  auto_git_push: true
