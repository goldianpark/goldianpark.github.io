<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 테마별 배경 그라디언트 -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" /><stop offset="50%" stop-color="#1e293b" /><stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- 황금 텍스트/뱃지 그라디언트 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- 우측 아트워크 패널 그라디언트 -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <!-- 글로우 필터 -->
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- 카드 그림자 필터 -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. 배경 메인 -->
  <rect width="1200" height="630" fill="url(#mainBg)" />

  <!-- 2. 장식용 앰비언트 라이트 (글로우 효과) -->
  <circle cx="150" cy="120" r="280" fill="#fbbf24" opacity="0.12" filter="url(#glowFilter)" />
  <circle cx="1050" cy="480" r="320" fill="#fbbf24" opacity="0.15" filter="url(#glowFilter)" />

  <!-- 3. 외곽 프리미엄 골드 프레임 테두리 -->
  <rect x="36" y="36" width="1128" height="558" rx="28" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="1.5" />
  <rect x="44" y="44" width="1112" height="542" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

  <!-- 4. 좌측 상단 브랜드 헤더 -->
  <g transform="translate(90, 85)">
    <!-- 골든라이프 브랜드 아이콘 -->
    <rect x="0" y="0" width="46" height="46" rx="12" fill="url(#goldGrad)" filter="url(#dropShadow)" />
    <!-- 왕관/새싹 심볼 (골든라이프 로고 간략화) -->
    <path d="M12 32 L15 17 L23 25 L31 17 L34 32 Z" fill="#1c1917" />
    
    <text x="62" y="24" font-family="'Pretendard', sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="-0.5">골든라이프</text>
    <text x="168" y="24" font-family="'Pretendard', sans-serif" font-size="15" font-weight="700" fill="#fbbf24" letter-spacing="-0.2">GoldenLife</text>
    <text x="62" y="42" font-family="'Pretendard', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">6070 시니어 복지·연금·건강 백과</text>
  </g>

  <!-- 5. 카테고리 태그 & 2026 개정판 뱃지 -->
  <g transform="translate(90, 160)">
    <!-- 카테고리 뱃지 -->
    <rect x="0" y="0" width="196" height="38" rx="19" fill="#451a03" stroke="#f59e0b" stroke-width="2" />
    <text x="18" y="24" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800" fill="#fef3c7">연금 &amp; 절세 상식</text>

    <!-- 테마 신뢰 뱃지 -->
    <g transform="translate(208, 0)">
      <rect x="0" y="0" width="165" height="38" rx="19" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="16" y="24" font-family="'Pretendard', sans-serif" font-size="14" font-weight="800" fill="#fde68a">★ 2026 연금·절세 공식</text>
    </g>
  </g>

  <!-- 6. 메인 타이틀 (좌측 영역, 3줄까지 깔끔하게 렌더링) -->
  <text x="90" y="260" font-family="'Pretendard', sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-1.5" filter="url(#dropShadow)">
    <tspan x="90" dy="0">상속세 면제 한도와 10년 합산</tspan><tspan x="90" dy="58">과세 피하는 사전 증여 황금</tspan><tspan x="90" dy="58">법칙</tspan>
  </text>

  <!-- 7. 핵심 요약 서브카피 박스 -->
  <g transform="translate(90, 465)">
    <rect x="0" y="0" width="580" height="54" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <!-- 좌측 골드 포인트 바 -->
    <rect x="0" y="0" width="6" height="54" rx="3" fill="url(#goldGrad)" />
    <text x="24" y="33" font-family="'Pretendard', sans-serif" font-size="17" font-weight="500" fill="#e2e8f0">부모와 자녀 모두 꼭 알아야 할 상속세 면제 한도(최대 10억)와 사전 증여 10년 합산 과세를 피하는 비법을 30년...</text>
  </g>

  <!-- 8. 하단 푸터 인포 -->
  <g transform="translate(90, 555)">
    <circle cx="6" cy="-5" r="4" fill="#10b981" />
    <text x="18" y="0" font-family="'Pretendard', sans-serif" font-size="15" font-weight="700" fill="#fde68a">공식 정보 검증 완료</text>
    <text x="170" y="0" font-family="'Pretendard', sans-serif" font-size="14" font-weight="400" fill="#94a3b8">• goldianpark.github.io</text>
  </g>

  <!-- 9. 우측 전용 맞춤형 테마 일러스트레이션 아트워크 -->
  
        <!-- 자녀 1억 증여 & 차용증 계약서 일러스트 -->
        <g transform="translate(940, 315)">
            <circle cx="0" cy="0" r="190" fill="#0284c7" opacity="0.25" filter="url(#glowFilter)"/>
            <circle cx="0" cy="0" r="175" fill="#0f172a" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" opacity="0.8"/>
            <circle cx="0" cy="0" r="150" fill="url(#panelGrad)" stroke="#0369a1" stroke-width="2"/>

            <!-- 정식 차용증 문서 -->
            <rect x="-65" y="-95" width="130" height="175" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
            <!-- 문서 제목 -->
            <rect x="-40" y="-80" width="80" height="12" rx="4" fill="#1e293b"/>
            <!-- 텍스트 라인들 -->
            <line x1="-48" y1="-50" x2="48" y2="-50" stroke="#94a3b8" stroke-width="3"/>
            <line x1="-48" y1="-35" x2="48" y2="-35" stroke="#94a3b8" stroke-width="3"/>
            <line x1="-48" y1="-20" x2="20" y2="-20" stroke="#94a3b8" stroke-width="3"/>
            <line x1="-48" y1="-5" x2="48" y2="-5" stroke="#94a3b8" stroke-width="3"/>
            <line x1="-48" y1="10" x2="35" y2="10" stroke="#94a3b8" stroke-width="3"/>

            <!-- 붉은 인장 도장 (Seal) -->
            <circle cx="35" cy="45" r="22" fill="#dc2626" stroke="#991b1b" stroke-width="2.5"/>
            <rect x="25" y="35" width="20" height="20" rx="3" fill="none" stroke="#ffffff" stroke-width="2"/>
            <text x="35" y="50" font-family="'Pretendard', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">공증</text>

            <!-- 4.6% 법정이자율 뱃지 -->
            <g transform="translate(-70, 75)">
                <rect x="-25" y="-16" width="105" height="32" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5"/>
                <text x="27" y="5" font-family="'Pretendard', sans-serif" font-size="13" font-weight="900" fill="#fde68a" text-anchor="middle">이자율 4.6%</text>
            </g>

            <!-- 10년 5천만원 비과세 -->
            <g transform="translate(60, -75)">
                <rect x="-30" y="-15" width="100" height="30" rx="15" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
                <text x="20" y="5" font-family="'Pretendard', sans-serif" font-size="12" font-weight="900" fill="#a7f3d0" text-anchor="middle">5천만원 비과세</text>
            </g>
        </g>
        
</svg>